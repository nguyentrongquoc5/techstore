# =============================================================================
# TechStore – Docker Compose (local / demo)
# API  : http://localhost:4000
# Web  : http://localhost:8080
# =============================================================================
services:
  api:
    image: techstore-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:./data/prod.db
      JWT_SECRET: ${JWT_SECRET:-techstore-local-secret-change-me}
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080,http://localhost:5173}
      TRUST_PROXY: "1"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_URL: ${VNPAY_URL:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/thanh-toan/ket-qua}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-http://localhost:8080/thanh-toan/ket-qua}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-}
    volumes:
      - ./backend/public/images:/app/public/images
      - api_data:/app/prisma/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    image: techstore-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:4000/api
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api_data:
