services:
  api:
    image: techstore-api:latest
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:./data/prod.db
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
    volumes:
      - ./backend/public/images:/app/public/images
      - api_data:/app/prisma/data
    restart: unless-stopped

  web:
    image: techstore-web:latest
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data: