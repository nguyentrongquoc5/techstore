services:
  api:
    image: techstore-api:latest
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:./data/prod.db
      JWT_SECRET: techstore-jenkins-secret
      PORT: 4000
    volumes:
      - ./backend/public/images:/app/public/images
      - api_data:/app/prisma/data
    restart: unless-stopped

  web:
    image: techstore-web:latest
    build:
      context: .
      args:
        # Browser gọi API qua máy host — đổi IP nếu truy cập từ máy khác
        VITE_API_URL: http://127.0.0.1:4000/api
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
